name: Validar protocolo

on:
  push:
  pull_request:

jobs:
  validar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estrutura e release
        shell: pwsh
        run: ./scripts/validar.ps1
